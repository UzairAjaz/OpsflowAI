services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opsflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsflow}
      POSTGRES_DB: ${POSTGRES_DB:-opsflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - opsflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: opsflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - opsflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsflow_pgdata:
  opsflow_redisdata:
